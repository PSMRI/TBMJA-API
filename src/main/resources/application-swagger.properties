# Swagger profile: starts the API without MySQL or Redis so CI can export /v3/api-docs.
# Run with --spring.profiles.active=swagger

api.dev.url=${API_DEV_URL:https://amritwprdev.piramalswasthya.org}
api.uat.url=${API_UAT_URL:https://uatamrit.piramalswasthya.org}
api.demo.url=${API_DEMO_URL:https://amritdemo.piramalswasthya.org}

server.port=9090

# In-memory H2 instead of MySQL
spring.datasource.url=jdbc:h2:mem:swaggerdb
spring.datasource.username=SA
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=none

# Redis is not available in CI; nothing connects to it until a request needs it
spring.data.redis.host=localhost
spring.data.redis.port=6379

jwt.secret=swagger-profile-dummy-secret-of-32-characters
cors.allowed-origins=http://localhost:*

springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true

logging.path=logs/
logging.file.name=logs/tbmja-api.log
