# Template for local development. Copy to common_local.properties (gitignored), fill in, and
# build with -DENV_VAR=local.

server.port=8095

##--------------------------------------------## Database (db_iemr)----------------------------------------------------
spring.datasource.url=jdbc:mysql://localhost:3306/db_iemr
spring.datasource.username=<db-username>
spring.datasource.password=<db-password>
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Redis
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.password=

# Must be the same secret as the other AMRIT APIs so their tokens are accepted here
jwt.secret=<jwt-secret-at-least-32-characters>

cors.allowed-origins=http://localhost:*

springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true

logging.path=logs/
logging.file.name=logs/tbmja-api.log
