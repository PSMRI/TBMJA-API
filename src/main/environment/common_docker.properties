# Docker builds: values are read from the container's environment variables at startup (${X}).

server.port=${TBMJA_API_PORT:8080}

##--------------------------------------------## Database (db_iemr)----------------------------------------------------
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Redis
spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=6379

jwt.secret=${JWT_SECRET_KEY}

cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

springdoc.api-docs.enabled=${SWAGGER_DOC_ENABLED:false}
springdoc.swagger-ui.enabled=${SWAGGER_DOC_ENABLED:false}

#ELK logging file name
logging.path=logs/
logging.file.name=${TBMJA_API_LOGGING_FILE_NAME}
