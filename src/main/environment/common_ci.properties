# CI / server builds: values are read from environment variables at build time (@env.X@).

server.port=@env.TBMJA_API_PORT@

##--------------------------------------------## Database (db_iemr)----------------------------------------------------
spring.datasource.url=@env.DATABASE_URL@
spring.datasource.username=@env.DATABASE_USERNAME@
spring.datasource.password=@env.DATABASE_PASSWORD@
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Redis
spring.data.redis.host=@env.REDIS_HOST@
spring.data.redis.port=6379

jwt.secret=@env.JWT_SECRET_KEY@

cors.allowed-origins=@env.CORS_ALLOWED_ORIGINS@

springdoc.api-docs.enabled=@env.SWAGGER_DOC_ENABLED@
springdoc.swagger-ui.enabled=@env.SWAGGER_DOC_ENABLED@

#ELK logging file name
logging.path=logs/
logging.file.name=@env.TBMJA_API_LOGGING_FILE_NAME@
